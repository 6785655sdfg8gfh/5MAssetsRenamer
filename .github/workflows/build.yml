name: Build 5M Assets Renamer

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ui:
    name: Build UI app (Tauri)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build exe
        working-directory: src-tauri
        run: npx --yes @tauri-apps/cli@2 build --no-bundle

      - uses: actions/upload-artifact@v4
        with:
          name: 5MAssetsRenamer-UI
          path: src-tauri/target/release/assets-renamer.exe

  build-cli:
    name: Build CodeWalkerCLI (C#)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: Restore packages
        run: nuget restore src-cli/CodeWalker.sln

      - name: Build CLI
        run: msbuild src-cli/CodeWalkerCLI/CodeWalkerCLI.csproj /p:Configuration=Release

      - uses: actions/upload-artifact@v4
        with:
          name: 5MAssetsRenamer-CLI
          path: src-cli/CodeWalkerCLI/bin/Release/
